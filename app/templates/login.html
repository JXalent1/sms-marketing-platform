<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — {{ brand.app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center">
    <div class="w-full max-w-sm px-6">
        <div class="text-center mb-8">
            <div class="inline-flex bg-{{ brand.color }}-600 text-white p-2 rounded-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm2 0v.5l6 3.5 6-3.5V5H4zm12 2.7l-5.5 3.2a1 1 0 01-1 0L4 7.7V15h12V7.7z"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900">{{ brand.short_name }}</h2>
            <p class="text-sm text-gray-500 mt-1">Sign in to access the dashboard</p>
        </div>

        {% if error %}
        <div class="mb-4 bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" id="username" required autofocus autocomplete="username"
                       class="mt-1.5 block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm shadow-sm focus:border-{{ brand.color }}-500 focus:ring-{{ brand.color }}-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" id="password" required autocomplete="current-password"
                       class="mt-1.5 block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm shadow-sm focus:border-{{ brand.color }}-500 focus:ring-{{ brand.color }}-500">
            </div>
            <button type="submit"
                    class="w-full py-2.5 px-4 rounded-lg text-sm font-medium text-white bg-{{ brand.color }}-600 hover:bg-{{ brand.color }}-700 shadow-sm">
                Sign in
            </button>
        </form>
    </div>
</body>
</html>
